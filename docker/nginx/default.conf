server {
    listen 80;
    server_name _;

    # BASE_PATH is substituted by entrypoint (default /collage)
    location = /health {
        proxy_pass http://127.0.0.1:8090/health;
    }

    location __BASE_PATH__/api/ {
        rewrite ^__BASE_PATH__/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location __BASE_PATH__/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location = / {
        return 302 __BASE_PATH__/;
    }
}
