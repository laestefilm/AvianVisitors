# AvianVisitors collage frontend for BirdNET-Go
#
# Access: http://<host>:8182/collage/
# BirdNET-Go UI stays at http://<host>:8180/

services:
  avian-collage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: avian-collage
    restart: unless-stopped
    ports:
      - "${AVIAN_PORT:-8182}:80"
    environment:
      BIRDNET_GO_URL: ${BIRDNET_GO_URL:-http://host.docker.internal:8180}
      BASE_PATH: ${BASE_PATH:-/collage}
      COLLAGE_ONLY: "1"
      FULL_REFRESH_MS: "300000"
      # Optional: on-demand illustration generation for missing species
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WANGP_ROOT: ${WANGP_ROOT:-}
      WANGP_MODEL: ${WANGP_MODEL:-qwen_image_20B}
      WANGP_RESOLUTION: ${WANGP_RESOLUTION:-1024x1024}
    volumes:
      - avian-generated:/data/generated
      # Optional: mount your local WanGP install (read-only is enough for API import)
      # - /path/to/Wan2GP:/wangp:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  avian-generated:
