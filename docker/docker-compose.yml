# AvianVisitors collage frontend for BirdNET-Go
#
# Default URL: http://<host>:8182/
# Optional subpath: set BASE_PATH=/collage -> http://<host>:8182/collage/
# BirdNET-Go UI stays at http://<host>:8180/

services:
  avian-collage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: avian-collage
    restart: unless-stopped
    ports:
      - "${AVIAN_PORT:-8182}:80"
    environment:
      BIRDNET_GO_URL: ${BIRDNET_GO_URL:-http://host.docker.internal:8180}
      # Leave empty to serve at http://host:8182/ (recommended on dedicated port).
      # Set to /collage if you prefer a subpath on this port.
      BASE_PATH: ${BASE_PATH:-}
      COLLAGE_ONLY: "1"
      FULL_REFRESH_MS: "300000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ILLUSTRATION_BACKFILL: ${ILLUSTRATION_BACKFILL:-1}
      ILLUSTRATION_BACKFILL_INTERVAL: ${ILLUSTRATION_BACKFILL_INTERVAL:-3600}
      GENERATION_MAX_CONCURRENT: ${GENERATION_MAX_CONCURRENT:-2}
      WANGP_ROOT: ${WANGP_ROOT:-}
      WANGP_MODEL: ${WANGP_MODEL:-qwen_image_20B}
      WANGP_RESOLUTION: ${WANGP_RESOLUTION:-1024x1024}
    volumes:
      - avian-generated:/data/generated
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  avian-generated:
